<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre a tag input</title>
    </head>
    <body>
        <form action="https://httpbin.org/post" method="POST" autocomplete="off">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" maxlength="50" placeholder="Digite seu nome aqui" required>
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email aqui" required>
            </div>
            <br>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="8" required>
            </div>
            <br>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="14" max="120" size="16" required>
            </div>
            <br>
            <div></div>
                <label for="datanasc">Data de nascimento:</label>
                <input type="date" name="datanasc" id="datanasc" required>
            </div>

            <input type="hidden" name="origem" value="site">
        </form>
    </body>
</html>
