<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre tags div, span e iframe</title>
    </head>
    <body>
        <h1>Exercício sobre tags div, span e iframe</h1>
        <h2>Div</h2>
        <h3>Cidades da Alemanha</h3>
        <div style="color:white; background-color: black;" >
            <p>Berlim</p>
        </div>
        <div style="color:white; background-color: red">
            <p>Hamburgo</p>
        </div>
        <div style="color:black; background-color: yellow;">
            <p>Bremen</p>
        </div>
        <hr>
        <h2>Span</h2>
        <h3>O que estamos estudando?</h3>
        <p>
            Estamos estudando HTML (<span style="color:red">HyperText Markup Language</span>)
        </p>
        <p>
            Aprendemos sobre as tag div, <span style="color:yellow">span</span> e iframe.
        </p>
        <hr>
        <h2>Iframe</h2>
        <h3>Conteúdo da página W3Schools incorporado </h3>
        <iframe src="https://www.w3schools.com/html/html_blocks.asp"
                width="600"
                height="400"
                allowfullscreen
        ></iframe>
    </body>
</html>
