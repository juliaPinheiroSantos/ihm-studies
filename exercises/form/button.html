<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre a tag button</title>
    </head>
    <body>
        <form action="https://httpbin.org/post" method="POST" autocomplete="off">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"></input>
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <br>
            <div>
                <input type="submit" value="Enviar" name="botão de envio">
            </div>
            <div>
                <input type="reset" value="Limpar" name="botão de reset">
            </div>
            <div>
                <button type="button">Calcular</button>
            </div>

        </form>
    </body>
</html>
