<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre Texto longo e arquivos</title>
    </head>
    <body>
        <form action="https://httpbin.org/post" method="POST" autocomplete="off" enctype="multipart/form-data">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required></input>
            </p>
            <p>
                <label for="msg">Mensagem</label>
                <textarea id="msg" name="mensagem" rows="6" cols="60" maxlength="500" required></textarea>
            </p>
            <p>
                <label>Foto:</label>
                <input type="file" name="foto">
            </p>
            <p>
                <button type="submit" autofocus>Enviar</button>
            </p>
            <p>
                <button type="reset">Limpar</button>
            </p>
        </form>
    </body>
</html>
