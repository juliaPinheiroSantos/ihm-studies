<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre imagens, áudio e vídeo em HTML</title>
    </head>
    <body>
        <h1>Exercício sobre imagens, áudio e vídeo em HTML</h1>
        <br>
        <h2>Imagens</h2>
        <h3>Imagem com url local e largura 300px</h3>
        <img src="img/img.png" alt="logo html5" width="300">
        <hr>
        <h3>Imagem com url externa</h3>
        <img src="https://hermes.dio.me/articles/cover/1ee9c50a-fccd-4ec8-b57a-6a592a157a6d.png" alt="logo html5 alternativa" width="100">
        <hr>
        <h3>Link clicável com imagem</h3>
        <a href="https://pt.wikipedia.org/wiki/HTML5" title="HTML5 no Wikipedia"><img src="img/img.png" alt="logo html5" width="200"></a>
        <hr>
        <br>
        <h2>Audio</h2>
        <audio src="audio/audio.mp3" controls muted></audio>
        <br>
        <h2>Video</h2>
        <video src="video/video.mp4" width="640" controls poster="img/capa.jpg"></video>

    </body>
</html>
