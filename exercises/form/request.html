<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício sobre Requisição HTTP</title>         
    </head>
    <body>
        <header>
            <h1>Requisição HTTP</h1>
        </header>
        <main>
            <form action="https://httpbin.org/post" method="POST" autocomplete="off">
                <fieldset>
                    <legend>Dados Pessoais:</legend>
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" name="nome" id="nome" minlength="3" placeholder="Digite seu nome">
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu email">
                    </p>
                    <p>
                        <label for="age">Idade:</label>
                        <input type="number" name="age" id="age" placeholder="Digite sua idade">
                    </p>
                    <p>
                        <button type="submit">Enviar</button>
                    </p>
                </fieldset>
            </form>
        </main>
    </body>
</html>
