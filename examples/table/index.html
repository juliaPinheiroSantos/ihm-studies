<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre Comentários</title>
    </head>
    <body>
        <h3>Exemplo 1</h3>
        <table border="1"> <!--Tabela-->
	        <tr>	<!--linha-->
		        <td>Hello</td><!--dado-->
		        <td>World</td>
		        <td>!<td>
	        </tr>
        </table>

        <h3>Exemplo colspan</h3>
        <table border="1">
            <tr>
                <th colspan="2">
                Detalhes do Pedido
                </th>
            </tr>
            <tr>
                <td>Produto A</td>
                <td>R$50.00</td>
            </tr>
        </table>

        <h3>Exemplo rowspan</h3>
        <table border="1">
            <tr>
                <th rowspan="3">Ocupa 3 linhas</th>
                <td>Linha 1</td>
            </tr>
            <tr>
                <td>Linha 2</td>
            </tr>
            <tr>
                <td>Linha 3</td>
            </tr>
        </table>
    </body>
</html>
