<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Exercício sobre Tabelas em HTML</title>
    </head>
    <body>
        <h1>Turma</h1>
        <table border="1">
            <tr>
                <th>Aluno</th>
                <th>Matrícula</th>
                <th>Nota</th>
            </tr>
            <tr>
                <td>Julia</td>
                <td>2025</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Jade</td>
                <td>2027</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Vitor</td>
                <td>2026</td>
                <td>10</td>
            </tr>
            <tr>
                <td colspan="2">
                    Total
                </td>
                <td>30</td>
            </tr>
        </table>
    </body>
</html>
